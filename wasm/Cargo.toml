[package]
name = "gallery-rs"
version = "0.1.0"
edition = "2021"
description = "Structured Cabling project archive — Leptos/WASM frontend"
license = "ISC"
# The crate is both a binary (the Wasm app) and a library (the pure model
# the tests drive), so the grouping and date logic is testable off-browser.
[lib]
name = "gallery_rs"
path = "src/lib.rs"

[[bin]]
name = "gallery-rs"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-net = { version = "0.6", features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlImageElement",
    "Storage", "Location", "Navigator", "Performance", "KeyboardEvent", "Event",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
