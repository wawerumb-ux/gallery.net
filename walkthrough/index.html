<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Walkthrough — Structured Cabling Project Archive</title>
<link rel="icon" type="image/png" href="../logo/favi.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./walkthrough.css">
<!-- The ThreeUI GenerativeTree: the landing's backdrop, and the first
     thing you see. One React island, built from the authored source in
     ../src (see ../src/Scene.tsx and vite.config.js). The walkthrough's own
     runtime below is still a classic script and is untouched. -->
<link rel="stylesheet" href="./shader-build/assets/shader.css">
<link rel="modulepreload" href="./shader-build/assets/shader.js">
</head>
<body class="wt" data-depth="1">
<div class="wt-ambient" id="wtAmbient" aria-hidden="true"></div>
<!-- The tree is the landing's backdrop and it is decorative, so it is hidden
     from assistive tech; the landing's own copy carries the meaning. On
     phones and under reduced motion it is not rendered at all — see
     ../src/shaders/host-boundary.css. -->
<div id="wt-shader-root" aria-hidden="true"></div>
<main class="wt-page">
  <div class="wt-media" id="wtMedia"></div>
  <section class="wt-panel">
    <span class="wt-counter" id="wtCounter"></span>
    <h1 class="wt-title" id="wtTitle"></h1>
    <p class="wt-copy" id="wtCopy"></p>
    <nav class="wt-dots" id="wtDots" aria-label="Walkthrough progress"></nav>
    <div class="wt-actions" id="wtActions"></div>
  </section>
</main>
<script src="./steps.js"></script>
<script src="./walkthrough.js"></script>
<script type="module" src="./shader-build/assets/shader.js"></script>
</body>
</html>
