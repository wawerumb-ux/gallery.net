<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Structured Cabling Project Archive</title>
<!-- The journey is scrubbed with the wheel, so the page itself must not
     scroll under it; overflow is clipped in journey.css. A wheel event
     that reaches the document is stopped there, which is why the
     listener is not passive. -->
<link rel="icon" type="image/png" href="../logo/favi.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./walkthrough.css">
<link rel="stylesheet" href="./journey.css">
</head>
<!-- The landing IS the walkthrough now: the request journey, played over
     the footage, with seven cards naming each stop. The slide deck that
     used to sit under this page is gone — no step pages, no rail, no
     transitions — along with the generative tree before it, the React
     island and the Vite build that fed it. Nothing on this page is a
     module any more: walkthrough.js builds the ambient field and the
     way in, journey.js plays the journey, and the video is the content. -->
<body class="wt" data-depth="1" data-journey>
<div class="wt-ambient" id="wtAmbient" aria-hidden="true"></div>
<!-- Depth plane 1 of 3 — the least responsive to the pointer. The scrim
     above the footage is what keeps a card legible over the near-white
     office shots as well as the near-black rack ones. -->
<div class="jr-video" id="jrVideo" aria-hidden="true">
  <!-- autoplay only takes with muted + playsinline, which is why both are
       in the markup rather than set from script. -->
  <video class="jr-video-el" id="jrVideoEl"
         src="../video/Web_request_travels_through_netw…_20261008015354.mp4"
         autoplay muted loop playsinline preload="metadata"></video>
  <div class="jr-scrim"></div>
</div>
<!-- Depth plane 3 of 3 — the most responsive. journey.js appends into
     this element, one group per connector. -->
<svg class="jr-lines" id="jrLines" aria-hidden="true" focusable="false"></svg>
<!-- Depth plane 2 of 3. Seven cards, one lit, each carrying its own line
     figure; journey.js builds them from stages.js so a stage is one
     object, not a page of markup. -->
<!-- The bottom group. Desktop dissolves it (display: contents) and each
     child takes its own corner; a phone keeps it as one fixed column, so
     the card, the two ways on and replay stack in flow and cannot
     overlap — the card's height varies with each stage's note, so any
     fixed offsets between them would be wrong for some stage. -->
<div class="jr-bottom">
  <div class="jr-cards" id="jrCards"></div>
  <div class="jr-landing-stack" id="jrStack">
    <div class="wt-landing-bar-slot" id="jrBarSlot"></div>
    <div class="jr-controls">
      <button class="jr-reset" id="jrReset" type="button">Replay from the start</button>
    </div>
  </div>
</div>
<main class="wt-page wt-page-landing">
  <section class="wt-panel">
    <!-- The journey cards carry the copy, so the title block is retired
         rather than duplicated. The panel survives as the control bar:
         the gate sends first-time visitors here, so the landing must
         still offer the way into the archive, or it becomes a trap (see
         walkthrough.js markSeen). The counter, title, copy and dots went
         with the deck that used to fill them. -->
    <span class="wt-counter" id="wtCounter" hidden></span>
    <h1 class="wt-title" id="wtTitle" hidden></h1>
    <p class="wt-copy" id="wtCopy" hidden></p>
    <nav class="wt-dots" id="wtDots" aria-label="Progress" hidden></nav>
    <div class="wt-actions" id="wtActions"></div>
  </section>
</main>

<script src="./walkthrough.js"></script>
<script src="./stages.js"></script>
<script src="./journey.js"></script>
</body>
</html>
