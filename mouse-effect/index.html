<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Mouse Effect Playground — gallery.net</title>
<link rel="icon" type="image/png" href="../logo/favi.png">
<link rel="stylesheet" href="mouse-effect.css">
</head>
<body>

<!-- The effect draws onto this full-viewport canvas. The native cursor is
     hidden over it (the playground paints its own skin) and re-shown while
     the guide is open so its buttons stay clickable. -->
<canvas id="c" class="me-stage" tabindex="0" aria-label="Mouse effect canvas"></canvas>

<!-- Live readout of the current particle type and cursor skin. -->
<div id="hud" class="me-hud" aria-live="polite"></div>

<!-- Reopen the guide after it is dismissed. -->
<button id="meGuideOpen" class="me-guide-open" type="button" aria-label="Open the how-to guide" title="How to use">?</button>

<!-- The built-in guide: a step-by-step card over the live canvas, so each
     control can be tried while it is being explained. -->
<div id="meGuide" class="me-guide" role="dialog" aria-modal="false" aria-labelledby="meGuideTitle">
  <div class="me-guide-card">
    <div id="meGuideDots" class="me-guide-dots" aria-hidden="true"></div>
    <h1 id="meGuideTitle" class="me-guide-title"></h1>
    <p id="meGuideBody" class="me-guide-body"></p>
    <p id="meGuideTry" class="me-guide-try" hidden></p>
    <div class="me-guide-actions">
      <button id="meGuideSkip" class="me-guide-btn" type="button">Skip</button>
      <span class="me-guide-spacer"></span>
      <button id="meGuidePrev" class="me-guide-btn" type="button">Back</button>
      <button id="meGuideNext" class="me-guide-btn me-primary" type="button">Next</button>
    </div>
  </div>
</div>

<script src="mouse-effect.js"></script>
</body>
</html>
