<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>How a request travels — Structured Cabling Project Archive</title>
<link rel="icon" type="image/png" href="../logo/favi.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./journey.css">
</head>
<!-- jr: the video is the content here, not an illustration of it, so it
     plays on load. autoplay only takes with muted + playsinline, which is
     why both are in the markup rather than set from script. -->
<body class="jr">
<!-- Depth plane 1 of 3 — the least responsive to the pointer. The scrim
     above it is what keeps a card legible over the near-white office
     shots as well as the near-black rack ones. -->
<div class="jr-video" id="jrVideo" aria-hidden="true">
  <video class="jr-video-el" id="jrVideoEl"
         src="../video/Web_request_travels_through_netw…_20261008015354.mp4"
         autoplay muted loop playsinline preload="metadata"></video>
  <div class="jr-scrim"></div>
</div>
<!-- Depth plane 3 of 3 — the most responsive. Rough.js appends into this
     element, one group per connector. -->
<svg class="jr-lines" id="jrLines" aria-hidden="true" focusable="false"></svg>
<!-- Depth plane 2 of 3. Seven cards, one lit; journey.js builds them
     from steps.js so a stage is one object, not a page of markup. -->
<div class="jr-cards" id="jrCards"></div>
<div class="jr-controls">
  <button class="jr-reset" id="jrReset" type="button">Reset</button>
</div>
<script src="./steps.js"></script>
<script src="./rough.js"></script>
<script src="./journey.js"></script>
</body>
</html>
